<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MediCheck AI - Smart Triage</title>
    <style>
        * { box-sizing: border-box; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body { background-color: #f4f7f6; margin: 0; padding: 20px; display: flex; justify-content: center; align-items: center; min-height: 100vh; }
        .card { background: #ffffff; width: 100%; max-width: 550px; padding: 30px; border-radius: 16px; box-shadow: 0 10px 25px rgba(0,0,0,0.08); text-align: center; }
        .logo { font-size: 28px; font-weight: bold; color: #0284c7; margin-bottom: 8px; }
        p.desc { color: #64748b; font-size: 14px; margin-bottom: 20px; }
        textarea { width: 100%; height: 120px; padding: 14px; border: 1.5px solid #cbd5e1; border-radius: 10px; font-size: 15px; resize: none; outline: none; transition: 0.2s; }
        textarea:focus { border-color: #0284c7; box-shadow: 0 0 0 3px rgba(2, 132, 199, 0.15); }
        button { background: #0284c7; color: white; border: none; padding: 14px; font-size: 16px; font-weight: bold; border-radius: 10px; cursor: pointer; width: 100%; margin-top: 15px; transition: 0.2s; }
        button:hover { background: #0369a1; }
        button:disabled { background: #94a3b8; cursor: not-allowed; }
        #result { margin-top: 25px; padding: 20px; border-radius: 10px; text-align: left; display: none; }
        .GREEN { background: #dcfce7; color: #166534; border: 1px solid #bbf7d0; }
        .YELLOW { background: #fef9c3; color: #854d0e; border: 1px solid #fef08a; }
        .RED { background: #fee2e2; color: #991b1b; border: 1px solid #fecaca; }
        .result-header { font-size: 18px; font-weight: bold; margin-bottom: 10px; }
        ul { margin: 8px 0 0 0; padding-left: 20px; }
        .disclaimer { margin-top: 25px; font-size: 12px; color: #94a3b8; border-top: 1px solid #e2e8f0; padding-top: 15px; }
    </style>
</head>
<body>

    <div class="card">
        <div class="logo">🩺 MediCheck AI</div>
        <p class="desc">Describe your symptoms to receive an instant AI-powered initial medical triage.</p>

        <textarea id="symptoms" placeholder="e.g. Severe headache with mild fever since yesterday..."></textarea>
        <button id="analyzeBtn" onclick="analyzeSymptoms()">Analyze Symptoms</button>

        <div id="result"></div>

        <div class="disclaimer">
            ⚠️ <strong>Disclaimer:</strong> MediCheck AI is designed for initial assessment and educational purposes only. It is not a substitute for professional medical diagnosis or emergency services.
        </div>
    </div>

    <script>
        async function analyzeSymptoms() {
            const symptoms = document.getElementById('symptoms').value.trim();
            const resultDiv = document.getElementById('result');
            const btn = document.getElementById('analyzeBtn');

            if (!symptoms) {
                alert("Please enter your symptoms first!");
                return;
            }

            btn.disabled = true;
            btn.textContent = "Analyzing...";
            resultDiv.style.display = "block";
            resultDiv.className = "";
            resultDiv.style.background = "#e2e8f0";
            resultDiv.style.color = "#334155";
            resultDiv.innerHTML = "⏳ Analyzing symptoms with AI...";

            try {
                // Relative path: works both locally (127.0.0.1:5000) and once deployed
                const response = await fetch('/analyze', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ symptoms: symptoms })
                });

                const data = await response.json();

                if (!response.ok || data.error) {
                    resultDiv.style.background = "";
                    resultDiv.className = "RED";
                    resultDiv.innerHTML = "❌ " + (data.error || "Something went wrong. Please try again.");
                    return;
                }

                const level = data.level || "GREEN";
                const adviceList = Array.isArray(data.advice) ? data.advice : [data.advice || "Consult a healthcare provider."];

                resultDiv.className = level;
                resultDiv.innerHTML = `
                    <div class="result-header">Triage Level: ${level}</div>
                    <p><strong>Recommended Specialty:</strong> ${data.specialty || 'General Practitioner'}</p>
                    <p><strong>Summary:</strong> ${data.summary || 'N/A'}</p>
                    <p><strong>Initial Recommendations:</strong></p>
                    <ul>
                        ${adviceList.map(item => `<li>${item}</li>`).join('')}
                    </ul>
                `;
            } catch (error) {
                console.error(error);
                resultDiv.className = "RED";
                resultDiv.innerHTML = "❌ Network error. Make sure the server is running!";
            } finally {
                btn.disabled = false;
                btn.textContent = "Analyze Symptoms";
            }
        }

        // Allow Ctrl+Enter to submit
        document.getElementById('symptoms').addEventListener('keydown', (e) => {
            if (e.ctrlKey && e.key === 'Enter') analyzeSymptoms();
        });
    </script>

</body>
</html>
